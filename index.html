<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" id="themecolor" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Live Message</title>
<style>
  /* Arial Narrow, self-hosted. Installed copies win via local(); phones,
     which ship no Arial Narrow at all, download the subset. */
  @font-face {
    font-family: 'Arial Narrow';
    font-style: normal;
    font-weight: 400 700;
    font-display: block;          /* block, not swap — a reflow would refit the text */
    src: local('Arial Narrow'), local('ArialNarrow'),
         url(fonts/arial-narrow.woff2) format('woff2');
  }

  :root {
    --bg: #ffffff;
    --fg: #000000;
    --blur: 2px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    cursor: default;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;   /* iOS must not resize our fitted text */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;       /* no double-tap zoom, pinch still works */
    overscroll-behavior: none;        /* no rubber-band / pull-to-refresh */
    transition: background 0.15s ease;
  }

  /* Square "cover" area. JS positions and sizes it against the visual
     viewport so the on-screen keyboard never covers the text. */
  #stage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    width: 90vmin;
    height: 90vmin;
    display: flex;
    align-items: center;     /* vertical-center the text block */
    justify-content: center;
  }

  /* The live text — justified like bratgenerator */
  #message {
    width: 100%;
    color: var(--fg);
    font-weight: 500;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 100px;                 /* JS overrides this to fit */
    line-height: 0.9;
    text-align: justify;
    text-align-last: justify;         /* last line spreads too — the brat look */
    word-spacing: 0;
    overflow-wrap: normal;            /* keep words whole; shrink font instead */
    word-break: normal;
    white-space: normal;
    outline: none;
    caret-color: var(--fg);
    filter: blur(var(--blur));
  }

  #message:empty::before {
    content: "type…";
    opacity: 0.18;
  }

  #help {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font: 13px/1.4 system-ui, sans-serif;
    color: var(--fg);
    opacity: 0.35;
    text-align: center;
    user-select: none;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }
  body.idle #help { opacity: 0; }

  /* ---- Touch controls -------------------------------------------------
     Every shortcut is keyboard-only, so a phone can reach nothing. This bar
     is the touch equivalent. JS positions it against the visual viewport so
     it rides above the keyboard instead of hiding behind it. */
  #bar {
    position: fixed;
    left: 50%;
    bottom: calc(10px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 6;
    display: none;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(127, 127, 127, 0.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    user-select: none;
    -webkit-user-select: none;
    max-width: calc(100vw - 16px);
  }
  body.touch #bar { display: flex; }
  body.touch #help { display: none; }

  #bar button {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    font: 600 13px/1 system-ui, -apple-system, sans-serif;
    letter-spacing: 0.01em;
    padding: 11px 13px;
    min-width: 44px;          /* 44px touch target */
    min-height: 44px;
    opacity: 0.62;
    cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  #bar button:active { background: rgba(127, 127, 127, 0.22); }
  #bar button[aria-pressed="true"] { opacity: 1; background: rgba(127, 127, 127, 0.26); }

  #toast {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    z-index: 7;
    background: rgba(0,0,0,0.82);
    color: #fff;
    font: 13px/1 system-ui, sans-serif;
    padding: 9px 14px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* brat mode — lime green cover */
  body.brat { background: #8ace00 !important; }
  body.brat #message { color: #000000 !important; caret-color: #000000; }
  body.brat #message:empty::before { content: "brat"; }
  body.brat #bar button { color: #000000; }
</style>
</head>
<body>
  <div id="stage">
    <div id="message" contenteditable="true" autofocus spellcheck="false"
         autocorrect="off" autocapitalize="none" enterkeyhint="done"></div>
  </div>
  <div id="toast"></div>

  <div id="bar" role="toolbar" aria-label="Controls">
    <button type="button" data-act="brat"   aria-pressed="false" title="brat green">brat</button>
    <button type="button" data-act="invert" aria-pressed="false" title="invert">invert</button>
    <button type="button" data-act="blur"   aria-pressed="true"  title="blur">blur</button>
    <button type="button" data-act="full"   aria-pressed="false" title="fullscreen" hidden>full</button>
    <button type="button" data-act="save"   title="save image">save</button>
    <button type="button" data-act="clear"  title="clear">clear</button>
  </div>

  <div id="help">type &nbsp;·&nbsp; <b>Tab</b> fullscreen &nbsp;·&nbsp; <b>⌘/Ctrl+B</b> brat &nbsp;·&nbsp; <b>⌘/Ctrl+↵</b> invert &nbsp;·&nbsp; <b>⌘/Ctrl+K</b> blur &nbsp;·&nbsp; <b>⌘/Ctrl+S</b> save webp &nbsp;·&nbsp; <b>Esc</b> clear</div>

<script>
  const stage = document.getElementById('stage');
  const msg   = document.getElementById('message');
  const bar   = document.getElementById('bar');

  // Touch devices get the button bar; pointer devices keep the keyboard hints.
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');

  // iPhone Safari has no element fullscreen; don't show a button that can't work.
  const canFullscreen = !!document.documentElement.requestFullscreen;
  if (canFullscreen) bar.querySelector('[data-act="full"]').hidden = false;

  // Scale the text so the block fills the square box — biggest size that
  // still fits both width (no word overflow) and height (no clipping).
  const MAX = 1600, MIN = 12;
  function fit() {
    let lo = MIN, hi = MAX, best = MIN;
    for (let i = 0; i < 16; i++) {
      const mid = (lo + hi) / 2;
      msg.style.fontSize = mid + 'px';
      if (msg.scrollWidth <= stage.clientWidth + 1 &&
          msg.scrollHeight <= stage.clientHeight + 1) {
        best = mid; lo = mid;
      } else {
        hi = mid;
      }
    }
    msg.style.fontSize = best + 'px';
  }

  // ---- Visual-viewport layout ------------------------------------------
  // A fixed, vmin-sized box is measured against the *layout* viewport, so an
  // open keyboard hides the text behind it. Size and centre everything on the
  // visual viewport instead, keeping clear of the button bar.
  const vv = window.visualViewport;
  function layout() {
    const w    = vv ? vv.width    : window.innerWidth;
    const h    = vv ? vv.height   : window.innerHeight;
    const offX = vv ? vv.offsetLeft : 0;
    const offY = vv ? vv.offsetTop  : 0;

    const barH  = document.body.classList.contains('touch') ? bar.offsetHeight + 20 : 0;
    const avail = Math.max(h - barH, 120);
    const side  = Math.min(w, avail) * 0.9;

    stage.style.width  = side + 'px';
    stage.style.height = side + 'px';
    stage.style.left   = (offX + w / 2) + 'px';
    stage.style.top    = (offY + avail / 2) + 'px';

    if (document.body.classList.contains('touch')) {
      bar.style.bottom = 'auto';
      bar.style.top = (offY + h - bar.offsetHeight - 10) + 'px';
    }
    fit();
  }
  document.addEventListener('fullscreenchange', () => { syncBar(); layout(); });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (vv) {
    vv.addEventListener('resize', layout);
    vv.addEventListener('scroll', layout);
  }

  msg.addEventListener('input', fit);
  // Paste as plain text — rich HTML would break the layout and export.
  msg.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  // Keep the caret at the end of the text.
  function caretToEnd() {
    const r = document.createRange();
    r.selectNodeContents(msg);
    r.collapse(false);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }
  function focusMsg() {
    msg.focus();
    caretToEnd();
  }

  // Pointer devices: swallow the mousedown so focus never leaves the text.
  // Touch devices must NOT do this — cancelling the gesture is exactly what
  // stops iOS from opening the keyboard. There, a plain tap does the work.
  if (isTouch) {
    document.addEventListener('click', (e) => {
      if (e.target.closest('#bar')) return;
      focusMsg();                    // inside the tap gesture, so iOS obeys
    });
  } else {
    document.addEventListener('mousedown', (e) => {
      if (e.target !== msg) { e.preventDefault(); focusMsg(); }
    });
  }

  if (document.fonts) {
    document.fonts.ready.then(layout);   // refit once the real face is in
  }

  window.addEventListener('load', () => {
    if (!isTouch) focusMsg();        // autofocus is ignored on mobile anyway
    layout();
  });

  // ---- Actions ----------------------------------------------------------
  let inverted = false, blurOn = true;

  function setInvert(on) {
    inverted = on;
    document.documentElement.style.setProperty('--bg', on ? '#000000' : '#ffffff');
    document.documentElement.style.setProperty('--fg', on ? '#ffffff' : '#000000');
    syncBar();
  }
  function setBlur(on) {
    blurOn = on;
    document.documentElement.style.setProperty('--blur', on ? '2px' : '0px');
    syncBar();
  }
  function toggleBrat() {
    document.body.classList.toggle('brat');
    syncBar();
    fit();
  }
  function clearText() {
    msg.textContent = '';
    fit();
  }

  // Keep the address bar / status bar colour matching the cover.
  function syncBar() {
    const bratOn = document.body.classList.contains('brat');
    document.getElementById('themecolor').content =
      bratOn ? '#8ace00' : (inverted ? '#000000' : '#ffffff');
    const set = (act, on) => {
      const b = bar.querySelector(`[data-act="${act}"]`);
      if (b) b.setAttribute('aria-pressed', String(on));
    };
    set('brat', bratOn);
    set('invert', inverted);
    set('blur', blurOn);
    set('full', !!document.fullscreenElement);
  }

  // Buttons must not steal focus, or the keyboard closes on every tap.
  bar.addEventListener('pointerdown', (e) => e.preventDefault());
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.preventDefault();
    switch (btn.dataset.act) {
      case 'brat':   toggleBrat(); break;
      case 'invert': setInvert(!inverted); break;
      case 'blur':   setBlur(!blurOn); break;
      case 'full':   toggleFullscreen(); break;
      case 'save':   exportImage(); break;
      case 'clear':  clearText(); break;
    }
    poke();
  });

  // Shortcuts (non-letter / modified keys so they don't clash with typing)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (document.fullscreenElement) return;  // Esc exits fullscreen; don't also clear
      clearText();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      toggleFullscreen();
    } else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      setInvert(!inverted);
    } else if ((e.metaKey || e.ctrlKey) && (e.key === 'b' || e.key === 'B')) {
      e.preventDefault();
      toggleBrat();
    } else if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      setBlur(!blurOn);
    } else if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      exportImage();
    }
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }

  // ---- High-quality WebP export ----------------------------------------
  // Re-renders the cover onto a large square canvas so it's crisp regardless
  // of screen size, reproducing the bratgenerator-style justified layout
  // (incl. justified last line) and the blur.
  const EXPORT_SIZE = 2048;        // output px (square)
  const EXPORT_MARGIN = 0.05;      // inner padding as fraction of size

  async function exportImage() {
    if (document.fonts) { try { await document.fonts.ready; } catch {} }
    const size = EXPORT_SIZE;
    const margin = Math.round(size * EXPORT_MARGIN);
    const inner = size - margin * 2;

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Colors & font from the current live state
    const ms = getComputedStyle(msg);
    const bg = getComputedStyle(document.body).backgroundColor;
    const fg = ms.color;
    const weight = ms.fontWeight || '500';
    const family = ms.fontFamily || 'Arial, sans-serif';
    const LH = 0.9;                 // matches CSS line-height

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);

    const text = (msg.innerText || '').replace(/\s+/g, ' ').trim();
    const words = text ? text.split(' ') : [];

    if (words.length) {
      // Greedy word-wrap at a given font size; returns lines + metrics.
      const wrap = (fontPx) => {
        ctx.font = `${weight} ${fontPx}px ${family}`;
        const sp = ctx.measureText(' ').width;
        const lines = [];
        let cur = [], curW = 0, maxWord = 0;
        for (const w of words) {
          const ww = ctx.measureText(w).width;
          if (ww > maxWord) maxWord = ww;
          if (!cur.length) { cur = [w]; curW = ww; continue; }
          const next = curW + sp + ww;
          if (next <= inner) { cur.push(w); curW = next; }
          else { lines.push(cur); cur = [w]; curW = ww; }
        }
        if (cur.length) lines.push(cur);
        return { lines, maxWord, height: lines.length * fontPx * LH, sp };
      };

      // Binary-search the largest font that fits the square.
      let lo = 8, hi = 4000, best = 8, lay = null;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        const L = wrap(mid);
        if (L.maxWord <= inner && L.height <= inner) { best = mid; lay = L; lo = mid; }
        else hi = mid;
      }
      const fontPx = best;
      const { lines, sp } = lay || wrap(best);

      // Draw — justified on every line, including the last (text-align-last).
      ctx.font = `${weight} ${fontPx}px ${family}`;
      ctx.fillStyle = fg;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      const stageW = stage.clientWidth || 700;
      ctx.filter = blurOn ? `blur(${(2 * size / stageW).toFixed(2)}px)` : 'none';

      const lineH = fontPx * LH;
      let y = margin + (inner - lines.length * lineH) / 2;

      for (const lineWords of lines) {
        if (lineWords.length === 1) {
          ctx.fillText(lineWords[0], margin, y);     // single word: left (CSS justify)
        } else {
          let natural = 0;
          for (const w of lineWords) natural += ctx.measureText(w).width;
          const gap = (inner - natural) / (lineWords.length - 1);
          let x = margin;
          for (const w of lineWords) {
            ctx.fillText(w, x, y);
            x += ctx.measureText(w).width + gap;
          }
        }
        y += lineH;
      }
      ctx.filter = 'none';
    }

    const base = slugify(text) || 'brat';
    canvas.toBlob((blob) => {
      if (!blob) { toast('export failed'); return; }
      const webp = blob.type === 'image/webp';
      const name = base + (webp ? '.webp' : '.png');
      saveBlob(blob, name, size);
    }, 'image/webp', 0.98);
  }

  // Mobile browsers treat <a download> poorly — iOS Safari often opens the
  // file instead of saving it. The share sheet is the native route, with the
  // download kept as the fallback.
  async function saveBlob(blob, name, size) {
    if (isTouch && navigator.canShare) {
      try {
        const file = new File([blob], name, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;                      // the sheet is its own confirmation
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;   // user dismissed
        /* fall through to download */
      }
    }
    download(blob, name);
    toast('saved ' + name + '  ·  ' + size + '×' + size);
  }

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);
  }

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  let toastTimer;
  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // Auto-hide the help bar when idle.
  let idleTimer;
  function poke() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
  ['mousemove', 'keydown', 'input', 'touchstart'].forEach(ev => document.addEventListener(ev, poke));
  poke();

  syncBar();
  layout();
</script>
</body>
</html>
